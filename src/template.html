<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --hair:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --accent:#2a78d6;
  --z-source:#86b6ef; --z-transport:#2a78d6; --z-runout:#104281;
  --s-destroyed:#d03b3b; --s-damaged:#ec835a; --s-edge:#fab219; --s-outwash:#b98ae0; --s-clear:#898781;
  --zoneA:#4a3aa7; --rain:#2a78d6;
  --site-kdnh:#2a78d6; --site-nmt:#eb6834; --site-tawkye:#1baf7a; --site-tby:#c13d93; --site-pny:#8a6d1f; --site-kdg:#6b4fc4; --site-pgz:#0f8a8a; --site-rbe:#a3681b; --site-thw:#b8312f; --site-lhl:#5b7083;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --hair:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --accent:#3987e5;
    --z-source:#184f95; --z-transport:#3987e5; --z-runout:#9ec5f4;
    --zoneA:#9085e9; --rain:#3987e5;
    --site-kdnh:#3987e5; --site-nmt:#d95926; --site-tawkye:#199e70; --site-tby:#d65ba8; --site-pny:#c9a43a; --site-kdg:#9b85e8; --site-pgz:#2bb5b5; --site-rbe:#d3953f; --site-thw:#e5625f; --site-lhl:#8fa3b5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --hair:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --accent:#3987e5;
  --z-source:#184f95; --z-transport:#3987e5; --z-runout:#9ec5f4;
  --zoneA:#9085e9; --rain:#3987e5;
  --site-kdnh:#3987e5; --site-nmt:#d95926; --site-tawkye:#199e70; --site-tby:#d65ba8; --site-pny:#c9a43a; --site-kdg:#9b85e8; --site-pgz:#2bb5b5; --site-rbe:#d3953f; --site-thw:#e5625f; --site-lhl:#8fa3b5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
.tk{display:flex;flex-direction:column;height:100vh;height:100dvh}
.tk header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--hair);background:var(--surface);flex-wrap:wrap}
.tk header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
.tk header p{margin:0;color:var(--ink-2);font-size:12.5px}
.tk header .sp{flex:1}
.btn{font:inherit;font-size:12.5px;border:1px solid var(--ring);background:var(--surface-2);color:var(--ink);
  border-radius:8px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--axis)}
.sites{display:inline-flex;border:1px solid var(--ring);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.sites button{font:inherit;font-size:12.5px;border:0;background:var(--surface-2);color:var(--ink-2);padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sites button+button{border-left:1px solid var(--ring)}
.sites button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.main{flex:1;display:flex;min-height:0}
.mapwrap{flex:1;min-width:0;position:relative}
#map{position:absolute;inset:0;background:#222}
.panel{width:460px;max-width:48vw;display:flex;flex-direction:column;border-left:1px solid var(--hair);background:var(--surface);min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;font-size:13px;background:none;border:0;color:var(--ink-2);padding:7px 8px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.pane{display:none;overflow-y:auto;padding:14px 16px 28px;flex:1}
.pane.on{display:block}
h2{font-size:15px;margin:18px 0 6px;font-weight:650}
h2:first-child{margin-top:2px}
h3{font-size:12px;margin:16px 0 4px;font-weight:650;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
p{margin:6px 0}
.muted{color:var(--muted)} .sec{color:var(--ink-2)}
.small{font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tile .v{font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.tile .l{font-size:12px;color:var(--ink-2)}
.tile.wide{grid-column:span 2}
.callout{border-left:3px solid var(--axis);padding:6px 10px;margin:10px 0;background:var(--surface-2);border-radius:0 8px 8px 0}
.callout ul{margin:4px 0;padding-left:16px}
ul.f{padding-left:18px;margin:6px 0} ul.f li{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:11.5px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.key{display:inline-flex;align-items:center;gap:6px;margin:2px 12px 2px 0;font-size:12px;color:var(--ink-2)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.chart{position:relative;margin:6px 0 4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:10.5px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:5px 8px;border-radius:6px;
  white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .08s;z-index:5}
.tip.on{opacity:1}
figure{margin:10px 0 16px} figure img{width:100%;display:block;border-radius:8px}
figcaption{font-size:12px;color:var(--ink-2);margin-top:5px}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:8px;overflow:hidden;margin:6px 0}
.seg button{font:inherit;font-size:12px;border:0;background:var(--surface-2);color:var(--ink-2);padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.views{display:grid;gap:8px;margin:8px 0}
.view{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:9px 11px;cursor:pointer;border:1px solid transparent}
.view:hover{border-color:var(--axis)}
.view b{display:block;font-size:13px}
.legend-box{background:var(--surface);color:var(--ink);padding:8px 10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:12px;line-height:1.6;max-width:230px}
.legend-box .sw{vertical-align:-1px;margin-right:6px}
.imgctl{background:var(--surface);color:var(--ink);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex;overflow:hidden}
.imgctl button{font:inherit;font-size:12px;border:0;background:var(--surface);color:var(--ink-2);padding:6px 10px;cursor:pointer}
.imgctl button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.lbl{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:700;font-size:12px;text-shadow:0 0 3px #000,0 0 2px #000}
.lbl::before{display:none}
.slbl{background:rgba(0,0,0,.6);border:0;color:#fff;font-weight:650;font-size:12.5px;box-shadow:none;padding:2px 7px;border-radius:5px}
.slbl::before{display:none}
.vlbl{background:rgba(0,0,0,.55);border:0;color:#fff;font-size:11.5px;box-shadow:none;padding:1px 5px}
.vlbl::before{display:none}
.lowz .vlbl{display:none}
.leaflet-popup-content{font-size:12.5px;line-height:1.45;margin:10px 12px}
.leaflet-popup-content b{font-weight:650}
.leaflet-control-layers{font-size:12.5px}
a{color:var(--accent)}
@media (max-width:820px){
  .main{flex-direction:column}
  .mapwrap{flex:none;height:52vh}
  .panel{width:auto;max-width:none;border-left:0;border-top:1px solid var(--hair);flex:1}
  .tk header p{display:none}
  .tk header{gap:8px;padding:8px 12px}
  .tk header .sp{display:none}
  .tk header > div:first-child{flex:1;min-width:0}
  .sites{order:3;width:100%;display:flex}
  .sites button{flex:1 1 auto;justify-content:center;padding:6px 4px;font-size:11.5px}
  .legend-box{display:none}
  .tk,.main,.panel{max-width:100vw;overflow-x:hidden}
}
</style>

<div class="tk">
  <header>
    <div>
      <h1>Launglon landslides, 26&ndash;27 Sep 2026</h1>
      <p>Ten drone surveys, Launglon Township, Tanintharyi Region, Myanmar</p>
    </div>
    <div class="sp"></div>
    <div class="sites" role="group" aria-label="Site" id="sites"></div>
    <button class="btn" id="theme" title="Switch light / dark">Theme</button>
  </header>
  <div class="main">
    <div class="mapwrap"><div id="map" role="region" aria-label="Map"></div></div>
    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-t="overview">Overview</button>
        <button role="tab" data-t="landslides">Landslides</button>
        <button role="tab" data-t="buildings">Buildings</button>
        <button role="tab" data-t="runout">Runout</button>
        <button role="tab" data-t="imagery">Before / after</button>
        <button role="tab" data-t="method">Method</button>
      </nav>
      <section class="pane" id="p-overview"></section>
      <section class="pane" id="p-landslides"></section>
      <section class="pane" id="p-buildings"></section>
      <section class="pane" id="p-runout"></section>
      <section class="pane" id="p-imagery"></section>
      <section class="pane" id="p-method"></section>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
const D = /*__DATA__*/null;
const SK = ['tby','pny','nmt','kdnh','kdg','tawkye','thw','lhl','rbe','pgz'], SITES = D.sites, T = D.total;  // north to south
const $ = s => document.querySelector(s);
const fmt = (x,d=0) => Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const ha = m2 => fmt(m2/1e4, 1);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S = k => SITES[k].summary;
const NAME = k => S(k).name;
const dateTxt = s => { const [y,m,d] = s.split('-'); return `${+d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]} ${y}`; };
const TYPE = {open:'Open-slope slide', channel:'Scoured channel / gully', minor:'Minor scar'};
const ST = {destroyed:['Destroyed','--s-destroyed'], damaged:['Damaged, standing','--s-damaged'], edge:['Standing at the edge','--s-edge'],
            outwash:['Standing in sediment','--s-outwash'], clear:['Standing, clear','--s-clear']};
const sw = v => `<span class="sw" style="background:${css(v)}"></span>`;
const siteDot = k => `<span class="dot" style="background:${css('--site-'+k)}"></span>`;
const tiles = arr => arr.map(([v,l,w]) => `<div class="tile ${w||''}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
const lis = arr => arr.map(s => `<li>${s}</li>`).join('');
const allRows = SK.flatMap(k => SITES[k].landslides.map(r => ({...r, site:k})));

/* ---------- state: #site/tab ---------- */
let site = 'all', tab = 'overview';
const TABS = ['overview','landslides','buildings','runout','imagery','method'];
function parseHash(){ const [a,b] = location.hash.slice(1).split('/');
  site = ['all', ...SK].includes(a) ? a : 'all'; tab = TABS.includes(b) ? b : (TABS.includes(a) ? a : 'overview'); }

/* ---------- theme ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('ll-theme'); if (t) root.dataset.theme = t; } catch(e){}
$('#theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('ll-theme', root.dataset.theme); } catch(e){}
  render(false);
};

/* ---------- map ---------- */
const map = L.map('map', {zoomControl:true, maxZoom:23});
const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:23, maxNativeZoom:19, attribution:'Basemap: Esri World Imagery (Vantor Vivid, 10 Jan 2026 here: pre-event)'}).addTo(map);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:23, maxNativeZoom:19, attribution:'&copy; OpenStreetMap contributors'});
const fpB = k => L.geoJSON(SITES[k].geo.footprint).getBounds();
const kadetB = fpB('kdnh').extend(fpB('nmt'));
const droneKadet = L.tileLayer('tiles/kadet/{z}/{x}/{y}.webp', {tileSize:512, zoomOffset:-1, minNativeZoom:14, maxNativeZoom:21,
  maxZoom:23, bounds:kadetB.pad(0.02), attribution:'Drone orthomosaics 3 &amp; 4 Oct 2026'});
const droneTK = L.tileLayer('tiles/tawkye/{z}/{x}/{y}.webp', {tileSize:512, zoomOffset:-1, minNativeZoom:14, maxNativeZoom:22,
  maxZoom:23, bounds:fpB('tawkye').pad(0.02), attribution:'Drone orthomosaics 2 Oct 2026 (GSM/TSBM)'});
const droneTB = L.tileLayer('tiles/thabyar/{z}/{x}/{y}.webp', {tileSize:512, zoomOffset:-1, minNativeZoom:14, maxNativeZoom:21,
  maxZoom:23, bounds:fpB('tby').pad(0.02), attribution:'Drone orthomosaics 5 Oct 2026'});
const dronePN = L.tileLayer('tiles/panyit/{z}/{x}/{y}.webp', {tileSize:512, zoomOffset:-1, minNativeZoom:14, maxNativeZoom:22,
  maxZoom:23, bounds:fpB('pny').pad(0.02), attribution:'Drone orthomosaic 5 Oct 2026 (road to Pa Nyit)'});
const droneKG = L.tileLayer('tiles/kadetgyi/{z}/{x}/{y}.webp', {tileSize:512, zoomOffset:-1, minNativeZoom:14, maxNativeZoom:21,
  maxZoom:23, bounds:fpB('kdg').pad(0.02), attribution:'Drone orthomosaics 6 Oct 2026 (Ka Det Gyi)'});
// Ka Det Gyi first, so Ka Det Nge Htein's flight is drawn over the 4 ha they share (the analysis there is Ka Det Nge Htein's)
// Pyin Gyi - Za Lut tiles live in a separate repo so this site stays under GitHub Pages' 1 GB limit
const droneZL = L.tileLayer('https://geonet-myanmar.github.io/launglon-landslides-tiles/zalut/{z}/{x}/{y}.webp', {tileSize:512, zoomOffset:-1, minNativeZoom:14, maxNativeZoom:21,
  maxZoom:23, bounds:fpB('pgz').pad(0.02), attribution:'Drone orthomosaics 7 Oct 2026 (Pyin Gyi - Za Lut)'});
const droneRB = L.tileLayer('https://geonet-myanmar.github.io/launglon-landslides-tiles/rabe/{z}/{x}/{y}.webp', {tileSize:512, zoomOffset:-1, minNativeZoom:14, maxNativeZoom:21,
  maxZoom:23, bounds:fpB('rbe').pad(0.02), attribution:'Drone orthomosaics 8 Oct 2026 (Ra Be)'});
// Ra Be before Pyin Gyi - Za Lut, so Za Lut's flight is drawn over the 55 ha they share (the analysis there is Za Lut's)
const droneTW = L.tileLayer('https://geonet-myanmar.github.io/launglon-landslides-tiles/thawin/{z}/{x}/{y}.webp', {tileSize:512, zoomOffset:-1, minNativeZoom:14, maxNativeZoom:21,
  maxZoom:23, bounds:fpB('thw').extend(fpB('lhl')).pad(0.02), attribution:'Drone orthomosaic 8 Oct 2026 (Tha Win, Lel Hla)'});
// Tha Win before Taw Kye, so Taw Kye's finer 2 Oct flights are drawn over the ground they share (the analysis there is Taw Kye's)
const drone = L.layerGroup([droneTB, dronePN, droneKG, droneKadet, droneTW, droneTK, droneRB, droneZL]).addTo(map);

const C = D.ctx;
const tsL = L.geoJSON(C.township, {style:{color:'#ffffff', weight:2, opacity:.8, fill:false}});
const vtL = L.geoJSON(C.vt, {style:{color:'#ffffff', weight:1.2, opacity:.7, dashArray:'4 4', fill:false},
  onEachFeature:(f,l) => l.bindPopup(`<b>${esc(f.properties.VT)}</b> village tract<br>${esc(f.properties.VT_MMR)}<br><span class="muted">${esc(f.properties.VT_PCODE)}</span>`)}).addTo(map);
const roadL = L.geoJSON(C.roads, {style:{color:'#f2f1ed', weight:2, opacity:.6}});
const villL = L.geoJSON(C.villages, {pointToLayer:(f,ll) => L.circleMarker(ll, {radius:5, color:'#fff', weight:1.5, fillColor:'#0b0b0b', fillOpacity:1}),
  onEachFeature:(f,l) => { l.bindTooltip(`${esc(f.properties.VILLAGE)} ${esc(f.properties.VLG_MMR)}`, {permanent:true, direction:'right', className:'vlbl', offset:[6,0]});
    l.bindPopup(`<b>${esc(f.properties.VILLAGE)}</b> ${esc(f.properties.VLG_MMR)}<br>Village tract: ${esc(f.properties.VT)}<br>MIMU PCode ${esc(f.properties.VLG_PCODE)}`); }}).addTo(map);
const schL = L.geoJSON(C.schools, {pointToLayer:(f,ll) => L.circleMarker(ll, {radius:4, color:'#fff', weight:1, fillColor:'#2a78d6', fillOpacity:1}),
  onEachFeature:(f,l) => l.bindPopup(`School: ${esc(f.properties.schoolname)} (MIMU)`)});

const byKey = {};
SK.forEach(k => SITES[k].landslides.forEach(r => byKey[k + '|' + r.id] = r));
const slideStyle = t => t === 'channel' ? {color:'#eda100', weight:1.6, dashArray:'5 3', fillColor:'#eda100', fillOpacity:.10}
  : t === 'minor' ? {color:'#eda100', weight:1, fillColor:'#eda100', fillOpacity:.08} : {color:'#eda100', weight:1.6, fillColor:'#eda100', fillOpacity:.12};
const G = {slides:[], labels:[], ct:[], outwash:[], excl:[], bld:[], zones:[], fp:[]};
const slideIdx = {};
SK.forEach(k => {
  const g = SITES[k].geo, nm = NAME(k);
  G.slides.push(L.geoJSON(g.landslides, {style:f => slideStyle(f.properties.type),
    onEachFeature:(f,l) => { const r = byKey[k + '|' + f.properties.id]; slideIdx[k + '|' + r.id] = l;
      l.bindPopup(`<b>${r.id} &middot; ${esc(r.name)}</b> <span class="muted">${esc(nm)}</span><br>${esc(TYPE[r.type])}. ${esc(r.description)}<br>`
        + `Area <b>${fmt(r.area_m2)} m²</b> (${ha(r.area_m2)} ha)` + (r.type !== 'minor' ? ` &middot; drop ${fmt(r.H_m)} m over ${fmt(r.L_m)} m (reach angle ${r.reach_angle_deg}&deg;${r.crown_at_edge || r.toe_at_edge ? ', runs beyond the survey' : ''})` : '')
        + (r.destroyed + r.damaged ? `<br>Buildings: ${r.destroyed} destroyed, ${r.damaged} damaged` : '')); }}));
  G.labels.push(L.layerGroup(SITES[k].landslides.filter(r => r.type !== 'minor').map(r => L.marker([r.label[1], r.label[0]], {opacity:0, interactive:false})
    .bindTooltip(r.id, {permanent:true, direction:'center', className:'lbl'}))));
  G.ct.push(L.layerGroup(SITES[k].landslides.filter(r => r.type !== 'minor').flatMap(r => [
    L.circleMarker([r.crown[1], r.crown[0]], {radius:4, color:'#000', weight:1, fillColor:'#eda100', fillOpacity:1}).bindPopup(`${r.id} crown, ${r.crown_z} m`),
    L.circleMarker([r.toe[1], r.toe[0]], {radius:4, color:'#000', weight:1, fillColor:'#ffffff', fillOpacity:1}).bindPopup(`${r.id} toe, ${r.toe_z} m`)])));
  if (g.outwash) G.outwash.push(L.geoJSON(g.outwash, {style:{color:'#e87ba4', weight:1.2, fillColor:'#e87ba4', fillOpacity:.22},
    onEachFeature:(f,l) => l.bindPopup(`<b>${esc(f.properties.name || 'Fields under sediment')}</b> &middot; ${esc(nm)}<br>${fmt(f.properties.area_m2)} m² under fresh sediment. ${esc(f.properties.description || '')} Mapped apart; not counted as landslide area.`)}));
  if (g.exclusions) G.excl.push(L.geoJSON(g.exclusions, {style:{color:'#ffffff', weight:1.2, dashArray:'3 3', fillColor:'#ffffff', fillOpacity:.08},
    onEachFeature:(f,l) => l.bindPopup(`<b>Excluded: ${esc(f.properties.name)}</b><br>${esc(f.properties.description)}`)}));
  G.zones.push(L.geoJSON(g.zones, {style:f => ({color:css('--zoneA'), weight:f.properties.zone === 'A' ? 1.5 : 1,
    fillColor:css('--zoneA'), fillOpacity:f.properties.zone === 'A' ? .30 : .12, opacity:.9}),
    onEachFeature:(f,l) => l.bindPopup(`<b>Zone ${f.properties.zone}</b> &middot; ${esc(nm)}<br>${esc(f.properties.label)}`)}));
  G.fp.push(L.geoJSON(g.footprint, {style:{color:'#7fdbff', weight:1.2, opacity:.9, fill:false}}));
  G.bld.push(L.geoJSON(g.buildings, {style:f => { const s = f.properties.status, c = css(ST[s][1]);
      return s === 'clear' ? {color:'#ffffff', weight:1, opacity:.75, fillOpacity:0} : {color:c, weight:1.5, fillColor:c, fillOpacity:.4}; },

function reachChart(box, keys){

  for (let v = 0; v <= X1; v += 5) s += `<line x1="${x(v)}" x2="${x(v)}" y1="${m.t}" y2="${H-m.b}" stroke="${css(v ? '--hair' : '--axis')}"/><text x="${x(v)}" y="${H-m.b+14}" text-anchor="middle">${v}&deg;</text>`;
  s += `<text x="${W-m.r}" y="${H-4}" text-anchor="end">reach angle = atan(drop / horizontal distance); lower travels further</text>`;
  const pts = [];
  keys.forEach((k,i) => { const yc = m.t + i*rh + rh/2, col = css('--site-'+k), ro = S(k).runout;
    s += `<text x="${m.l-8}" y="${yc+4}" text-anchor="end" style="fill:${css('--ink-2')};font-size:11.5px">${esc(NAME(k))}</text>`;
    s += `<line x1="${x(ro.alpha_open)}" x2="${x(ro.alpha_open)}" y1="${yc-17}" y2="${yc+17}" stroke="${css('--ink-2')}" stroke-width="1.5"/>`;
    s += `<line x1="${x(ro.alpha_channel)}" x2="${x(ro.alpha_channel)}" y1="${yc-17}" y2="${yc+17}" stroke="${css('--ink-2')}" stroke-width="1.5" stroke-dasharray="3 2"/>`;
    SITES[k].landslides.filter(r => r.type !== 'minor').forEach((r,j) => { const edge = r.crown_at_edge || r.toe_at_edge, dy = (r.type === 'open' ? -7 : 7);
      const cx = x(Math.min(r.reach_angle_deg, X1)), cy = yc + dy;

      s += `<circle cx="${cx}" cy="${cy}" r="9" fill="transparent" data-k="${k}" data-id="${r.id}" style="cursor:pointer"/>`; }); });
  box.innerHTML = s + '</svg>';
  hover(box, 'circle[data-id]', el => { const r = byKey[el.dataset.k + '|' + el.dataset.id];
    return `${esc(NAME(el.dataset.k))} ${r.id}: ${r.reach_angle_deg}&deg; (${r.type === 'open' ? 'open slope' : 'channel'})${r.crown_at_edge || r.toe_at_edge ? ', beyond survey' : ''}`; });
  box.querySelectorAll('circle[data-id]').forEach(el => el.onclick = () => { site = el.dataset.k; tab = 'landslides'; go(false); zoomTo(el.dataset.k, el.dataset.id); });
}

function zoneChart(box, k){
  const rows0 = SITES[k].landslides, minor = rows0.filter(r => r.type === 'minor');
  const rows = rows0.filter(r => r.type !== 'minor');
  if (minor.length) rows.push({id:`+${minor.length}`, name:'minor scars', area_m2:minor.reduce((a,r) => a + r.area_m2, 0),
    source_m2:minor.reduce((a,r) => a + r.source_m2, 0), transport_m2:minor.reduce((a,r) => a + r.transport_m2, 0), runout_m2:minor.reduce((a,r) => a + r.runout_m2, 0), agg:true});
  const W = 420, rh = 24, m = {l:48, r:46, t:4, b:20}, H = m.t + m.b + rows.length*rh;
  const max = Math.ceil(Math.max(...rows.map(r => r.area_m2)) / 1e4) * 1e4, x = v => m.l + (W - m.l - m.r) * v / max, step = max > 6e4 ? 2e4 : 1e4;
  const Z = [['source','--z-source','Source (≥ 20°)'], ['transport','--z-transport','Transport (8–20°)'], ['runout','--z-runout','Runout on flat ground (< 8°)']];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Area of each landslide by slope zone">`;
  for (let v = 0; v <= max; v += step) s += `<line x1="${x(v)}" x2="${x(v)}" y1="${m.t}" y2="${H-m.b}" stroke="${css(v ? '--hair' : '--axis')}"/><text x="${x(v)}" y="${H-6}" text-anchor="middle">${v/1e4} ha</text>`;
  rows.forEach((r,i) => { const yy = m.t + i*rh + 5, h = rh - 10; let acc = 0;
    const parts = Z.map(([z,v]) => [r[z + '_m2'], css(v)]).filter(p => p[0] > 0), zs = parts.reduce((a,p) => a + p[0], 0), kk = zs ? r.area_m2 / zs : 0;
    parts.forEach(([a,c],j) => { const w = Math.max(x(acc + a*kk) - x(acc) - (j < parts.length-1 ? 2 : 0), 0), last = j === parts.length-1, x0 = x(acc);
      s += last && w > 4 ? `<path d="M${x0},${yy} h${w-4} q4,0 4,4 v${h-8} q0,4 -4,4 h${-(w-4)} z" fill="${c}"/>` : `<rect x="${x0}" y="${yy}" width="${w}" height="${h}" fill="${c}"/>`;
      acc += a*kk; });
    s += `<text x="${m.l-6}" y="${yy+h/2+3.5}" text-anchor="end" style="fill:${css('--ink-2')}">${r.id}</text><text x="${x(r.area_m2)+5}" y="${yy+h/2+3.5}">${ha(r.area_m2)}</text>`;
    s += `<rect x="0" y="${m.t+i*rh}" width="${W}" height="${rh}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`; });
  box.innerHTML = s + '</svg>';

  box.querySelectorAll('rect[data-i]').forEach(el => { const r = rows[+el.dataset.i]; if (!r.agg) el.onclick = () => zoomTo(k, r.id); });

}

  <div class="seg" role="group"><button class="zbtn" aria-pressed="false">Show reach zones on the map</button></div>
  <table><thead><tr><th>Site</th><th class="n">&alpha; open</th><th class="n">&alpha; channel</th><th class="n">Standing in A</th><th class="n">only B</th></tr></thead><tbody>

    kdg: `On the forested hills west of Ka Det Gyi and Nyaungdon and south of Wet Thar Kin, ${rows.length} landslides cover <b>${ha(x.area_total_m2)} ha</b> &mdash; chutes, gullies and one large flow, KGN-01 (${ha(big.area_m2)} ha). The villages on the flat ground east and north of the hills were not reached. North of Wet Thar Kin's road, <b>${ha(x.outwash_m2)} ha</b> of fields lie under the eastern end of the sediment fan from Ka Det Nge Htein's debris flow.`,
    pny: `On the mountainside east of Pa Nyit, where the only road to the village winds down in hairpins, a forest stream was scoured to bare rock and slopes failed onto the road. ${rows.length} landslides cover <b>${ha(x.area_total_m2)} ha</b>; the largest, PN-01, is a channel ${fmt(big.L_m)} m long that crosses the road at an S-bend. No village lies in the survey: Pa Nyit is 1.7 km to the west.`,
    tby: `A debris flow came down the forested valley north-west of Tha Byar, scouring its stream into a channel 30&ndash;60 m wide, and dropped a fan of boulders, sand and logs at the head of the village; a second flow came in from the south-west. With the slides and channels on the ridge west of the village, ${rows.length} landslides cover <b>${ha(x.area_total_m2)} ha</b>; TB-01 alone is ${ha(big.area_m2)} ha. A further <b>${ha(x.outwash_m2)} ha</b> of the village, its orchards and the fields across the main road lie under sediment.`,
    kdnh: `A debris flow came down the forested valley west of Ka Det Nge Htein and cut through the middle of the village. With ${rows.length - 1} smaller slides and channels on the valley walls, ${rows.length} landslides cover <b>${ha(x.area_total_m2)} ha</b>; KD-01 alone is ${ha(big.area_m2)} ha. Beyond the village a further <b>${ha(x.outwash_m2)} ha</b> of paddy lies under sediment.`,
    nmt: `South of the road at Ngone Min Taung, the stream beds of the forested hills were scoured to sand and boulders and the slopes below the pagoda failed. ${rows.length} scars and channels cover <b>${ha(x.area_total_m2)} ha</b>, ${ha(x.area_by_type_m2.channel)} ha of it in channels. The village of Htein Gyi to the north-east was not reached.`,
    tawkye: `${rows.length} landslides tore down the forested slope west of Taw Kye and buried part of the village. Together they cover <b>${ha(x.area_total_m2)} ha</b>; <b>${ha(x.area_runout_flat_m2)} ha</b> of that is debris on the flat valley floor where the houses, road and paddies are.`}[k];
  const finds = {
    thw: [`<b>The valley north-west of Taw Kye was stripped.</b> TW-01 broke away from a wide scar at the head of the valley and ran ${fmt(byKey['thw|TW-01'].L_m)} m down it (${ha(byKey['thw|TW-01'].area_m2)} ha); the western channel network that joined it (TZ-01) is the largest feature, ${ha(byKey['thw|TZ-01'].area_m2)} ha. Their sand and mud spread over the valley mouth, across the road and over paddies east of it. This is the feeder the 2 Oct Taw Kye survey saw entering from outside its edge, which built Taw Kye's LS-01 mud fan.`,
          `<b>Tha Win was hit from behind.</b> Channels from the hills (TZ-02) and a flow from the south-west (TZ-04) met at the foot of the hill behind the village and spread sand through its western part: <b>${bs.destroyed} buildings gone</b> (no roof left) and <b>${bs.outwash} standing in sediment</b>. Dawei Watch reported the road between Taw Kye and Tha Win blocked by landslide debris; no report gives deaths or houses lost at Tha Win.`,
          `The open slides stopped at ${x.runout.alpha_open}&ndash;${Math.max(...rows.filter(r => r.type === 'open' && !r.crown_at_edge && !r.toe_at_edge).map(r => r.reach_angle_deg))}&deg;; the channels behind Tha Win ran out at ${x.runout.alpha_channel}&deg;. The village is on flat ground at the foot of the hills, so <b>${R.standing_in_B} standing buildings</b> fall in zone B and only ${R.standing_in_A} in zone A; the ${bs.destroyed} destroyed are in zone B.`,
          `Every source was closed forest before the event (Sentinel-2 Jan&ndash;Apr 2026 NDVI ${Math.min(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}&ndash;${Math.max(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}).`,
          `The ground of the 2 Oct Taw Kye survey, flown at 3.75&ndash;5.68 cm, is left to Taw Kye: TZ-03, TZ-10 and smaller features run into it, and their lower reaches are mapped there.`],
    lhl: [`<b>One flow did almost all of it.</b> LL-01 broke away in two prongs high on the hills (crown ${fmt(byKey['lhl|LL-01'].crown_z)} m) and ran ${fmt(byKey['lhl|LL-01'].L_m)} m east down a forested valley, scouring it to grey sand, to the road at the south end of Lel Hla: ${ha(byKey['lhl|LL-01'].area_m2)} of the ${ha(x.area_total_m2)} ha. Its fan crossed the road and covered ${ha(x.outwash_m2)} ha of gardens east of it.`,
          `<b>No building was destroyed.</b> One house at the mouth of LL-01 stands at the edge of the debris and ${bs.outwash} stand in the sediment east of the road. No report names Lel Hla; the road between Tha Win and Tha Kyet Taw, which LL-01 reached, was reported blocked.`,
          `The open slides stopped at ${x.runout.alpha_open}&ndash;${Math.max(...rows.filter(r => r.type === 'open' && !r.crown_at_edge && !r.toe_at_edge).map(r => r.reach_angle_deg))}&deg;; LL-01 ran out at ${x.runout.alpha_channel}&deg;. ${R.standing_in_A} standing buildings lie in zone A, ${R.standing_in_B} more in zone B.`],
    rbe: [`<b>The road was buried at several points.</b> RB-01 crossed it at the north, the road-corridor network (RZ-03) and the slides RZ-08 to RZ-10 ran down onto it further south, and debris lay along it where it turns west. This is the only road into the Kyauk Twin village tract (about 350 households), which Dawei Watch reported cut off with no relief on 30 Sep.`,
          `<b>Few people live here</b>: four buildings are in the survey; the house by the road at the north stands at the edge of RB-01's deposit, the rest are clear. No report gives deaths or destroyed houses on this road.`,
          `The open-slope slides stopped at ${S('rbe').runout.alpha_open}&ndash;${Math.max(...rows.filter(r => r.type === 'open' && !r.crown_at_edge && !r.toe_at_edge).map(r => r.reach_angle_deg))}&deg;; the long east channel network (RZ-04) ran out at ${S('rbe').runout.alpha_channel}&deg;, so no channel out-ran the open slides and runout zone B is empty.`,
          `All source areas were closed forest before the event (Sentinel-2 Jan&ndash;Apr 2026 NDVI ${Math.min(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}&ndash;${Math.max(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}). Two plantation plots felled or burnt since January, terraces, ponds and cultivated plots are excluded.`,
          `The 55 ha this survey shares with Pyin Gyi - Za Lut, including that site's PG-04 scars and PG-05 flow, are counted there only.`],
    pgz: [`<b>PG-01 did all the damage to houses</b>: ${byKey['pgz|PG-01'].destroyed} footprinted buildings under its debris have no roof left and ${byKey['pgz|PG-01'].damaged} stand damaged; on 7 Oct machinery was digging through the deposit. It ran ${fmt(byKey['pgz|PG-01'].L_m)} m from a crown at ${fmt(byKey['pgz|PG-01'].crown_z)} m (reach angle ${byKey['pgz|PG-01'].reach_angle_deg}&deg;).`,
          `<b>PG-03 cut the road north of the village</b>: fed by the scars of PG-04 ${fmt(byKey['pgz|PG-04'].crown_z - byKey['pgz|PG-03'].toe_z)} m higher, the debris travelled about 1.2 km down the valley at ${x.runout.alpha_channel}&deg; and spread grey sand and boulders across the road and the plantation beyond it.`,
          `Dawei Watch reported about 20 houses lost at Za Lut Pyin Gyi &mdash; 10 buried near the five pagodas, 10 filled with sediment &mdash; one man killed and about 200 people cut off. The ${x.buildings_status.destroyed} destroyed buildings mapped here agree in scale; Pyin Gyi and Za Lut's MIMU points lie 1.4 km south of the survey, so some reported houses may be outside it.`,
          `Three dark rock slabs on the hillside that were already bare in January, and a rectangular plot cleared by people, are excluded.`,
          `<b>${R.standing_in_A} standing buildings</b> lie in runout zone A &mdash; nearly the whole settlement, which sits at the foot of a 280 m ridge.`],
    kdg: [`<b>No footprinted building was hit.</b> The nearest standing footprint is ${fmt(x.nearest_standing_m)} m from a mapped landslide; ${bs.outwash || 0} stands at the edge of the sediment-covered fields.`,
          `<b>KGN-01 ran unusually far</b> for an open-slope flow: ${fmt(big.H_m)} m of drop over ${fmt(big.L_m)} m (reach angle ${big.reach_angle_deg}&deg;). Beyond its mapped toe the debris went on through a clearing that was already bare in January &mdash; so it is not counted &mdash; to within a few metres of two houses beside the village road. Neither house has a footprint; both appear to be standing.`,
          `The slides on the hills stopped at ${Math.min(...rows.filter(r => r.type === 'open').map(r => r.reach_angle_deg))}&ndash;${Math.max(...rows.filter(r => r.type === 'open').map(r => r.reach_angle_deg))}&deg;; the channels, steep and short, at ${Math.min(...rows.filter(r => r.type === 'channel').map(r => r.reach_angle_deg))}&deg; or more, so no channelised flow ran further than KGN-01 and runout zone B is empty.`,
          `All source areas were forest or plantation before the event (Sentinel-2 Jan&ndash;Apr 2026 NDVI ${Math.min(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}&ndash;${Math.max(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}).`,
          `<b>${R.standing_in_A} standing buildings</b> of ${S('kdg').reach.standing_in_A + S('kdg').reach.standing_outside} lie in runout zone A, on the flat ground at the foot of the hills: KGN-01's low angle carries the zone further than the other slides here would. Treat it as an upper bound.`,
          `The mother and son reported dead at Ka Det Gyi were found in their orchard "a few miles" from the village; it is not identifiable in this survey.`],
    pny: [`<b>The road was cut where the slides met it.</b> PN-04 is a cluster of failures at the hairpins (${fmt(byKey['pny|PN-04'].area_m2)} m²) whose debris lay across the road and ran down the slope below it, and PN-01 crosses the road at the S-bend. Dawei Watch reported the road blocked between Launglon and Pa Nyit; this survey is consistent with that blockage, but the report does not say where.`,
          `PN-01 dropped ${fmt(big.H_m)} m over ${fmt(big.L_m)} m (reach angle ${big.reach_angle_deg}&deg;); it runs on beyond the south-west edge of the survey, so that is a minimum.`,
          `<b>The slopes are steep</b>: open-slope slides stopped at ${S('pny').runout.alpha_open}&ndash;${Math.max(...rows.filter(r => r.type === 'open').map(r => r.reach_angle_deg))}&deg;, steeper than at any other site, on ground averaging ${Math.round(rows.reduce((a,r) => a + r.slope_mean_deg * r.area_m2, 0) / x.area_total_m2)}&deg;.`,
          `All sources were forest, scrub or grass before the event (Sentinel-2 Jan&ndash;Apr 2026 NDVI ${Math.min(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}&ndash;${Math.max(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}).`,
          `<b>One building</b> stands in the survey, a hut by the road, untouched but inside runout zone A. Villagers recalled that in 1997 a slope collapse at Pa Nyit buried about 100 houses and killed 61 people.`],
    tby: [`<b>The village was mostly flooded with sediment rather than buried</b>: ${bs.destroyed || 0} footprinted houses have no roof left and ${bs.damaged || 0} stand damaged in debris, but <b>${bs.outwash || 0} stand in sediment</b> that ran between the houses. Residents reported 4 houses lost and nearly 200 with mud inside.`,
          `<b>TB-01's source lies beyond the flight</b>: inside the survey it is a scoured channel and fan, ${fmt(big.L_m)} m long. It was fed by the long slide TB-03 (${ha(byKey['tby|TB-03'].area_m2)} ha), which broke away at ${fmt(byKey['tby|TB-03'].crown_z)} m on the ridge and ran ${fmt(byKey['tby|TB-03'].L_m)} m down to the valley floor, and by the TC-01 channel network.`,
          `From TB-03's crown to the toe of the fan in the village the debris fell ${fmt(byKey['tby|TB-03'].crown_z - big.toe_z)} m over about 1.1 km, a reach angle of <b>${x.runout.alpha_channel}&deg;</b>: the most mobile flow of the ten sites.`,
          `All source areas were forest or plantation before the event (Sentinel-2 Jan&ndash;Apr 2026 NDVI ${Math.min(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}&ndash;${Math.max(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}).`,
          `<b>The runout screening does not reach the village</b> (${R.standing_in_A + R.standing_in_B} standing buildings in its zones), although TB-01 and TB-05 did: on the flat, forested valley floor the 30 m DEM gives the debris nowhere downhill to go. See Runout.`],
    kdnh: [`<b>KD-01 did almost all the damage</b>: ${big.destroyed} of the ${bs.destroyed} destroyed buildings stood in its path. It dropped ${fmt(big.H_m)} m over ${fmt(big.L_m)} m within the survey (reach angle ${big.reach_angle_deg}&deg;; its source lies beyond the flight, so the true path is longer).`,
           `Its deposit is pale sand, gravel and boulders, not the orange soil of Taw Kye, so roofless footprints read as &ldquo;grey&rdquo; and 12 had to be re-labelled destroyed by eye.`,
           `The four open-slope chutes on the north wall (KD-02 to KD-05) stopped at ${Math.min(...rows.filter(r => r.type === 'open' && !r.toe_at_edge).map(r => r.reach_angle_deg))}&ndash;${Math.max(...rows.filter(r => r.type === 'open' && !r.toe_at_edge).map(r => r.reach_angle_deg))}&deg;, steeper than Taw Kye's.`,
           `All source areas were dense forest before the event (Sentinel-2 Jan&ndash;Apr 2026 NDVI ${Math.min(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}&ndash;${Math.max(...rows.map(r => r.ndvi_pre_source).filter(v => v != null)).toFixed(2)}), and closed canopy in the Esri image of 10 Jan 2026.`,
           `<b>${R.standing_in_A} standing buildings</b> lie in runout zone A and ${R.standing_in_B} more in zone B &mdash; most of the rest of the village sits on the fan of the same valley.`],
    nmt: [`<b>${x.n_by_type.channel} scoured channels make up ${Math.round(100 * x.area_by_type_m2.channel / x.area_total_m2)}% of the disturbed ground</b>. NM-01, the west river channel, is the largest single feature: ${ha(big.area_m2)} ha of stream bed stripped to sand and boulders.`,
           `The open-slope failures whose whole length was surveyed (NM-05, NM-07, NM-08) stopped at ${Math.min(...rows.filter(r => r.type === 'open' && !r.crown_at_edge).map(r => r.reach_angle_deg))}&ndash;${Math.max(...rows.filter(r => r.type === 'open' && !r.crown_at_edge).map(r => r.reach_angle_deg))}&deg;, the most mobile of the three sites. NM-05's debris reached the road.`,
           `The red excavation beside the village and the pagoda and monastery compounds were already bare in January 2026 and are excluded, as are ${x.n_exclusions - 4} small patches rejected on image chips (canopy gaps, a roof, a footpath).`,
           `<b>One building</b> in the survey stands in debris, beside the west river channel. No report names Ngone Min Taung or Htein Gyi.`,
           `${R.standing_in_A} standing buildings lie in runout zone A, mostly at the foot of the slopes south of the road.`],
    tawkye: [`<b>LS-03 did most of the damage to houses</b>: its twin scars merged into one flow that buried the west side of the northern village to the road. ${byKey['tawkye|LS-03'].destroyed} of the ${bs.destroyed} destroyed buildings are in it.`,
             `<b>LS-07 is the largest</b> (${ha(byKey['tawkye|LS-07'].area_m2)} ha): it crossed the road and spread a fan across the paddies.`,
             `The hillslope flows stopped at reach angles of 17.6&ndash;20.7&deg;; the channelised LS-04 ran further (13.4&deg;).`,
             `<b>${R.standing_in_A} standing buildings</b> lie in zone A, ${R.standing_in_B} more in zone B.`]}[k];
  return `<h2>${esc(x.name)} ${esc(x.mmr)}</h2>
  <p class="small muted">${mimu}, ${esc(x.vt)} village tract &middot; drone survey ${dateTxt(x.flown)}, ${x.gsd_cm} cm/pixel, ${fmt(x.survey_ha)} ha</p>
  <p class="sec">${lede}</p>
  <div class="tiles">${tiles([[x.n_landslides, 'landslides mapped'], [ha(x.area_total_m2) + ' ha', 'ground failed, scoured or buried'],
    [bs.destroyed || 0, 'buildings destroyed (no roof left)'], [bs.damaged || 0, 'damaged, still standing in debris'],
    k === 'tby' ? [bs.outwash || 0, 'buildings standing in sediment (the runout screening misses this village; see Runout)', 'wide'] : [R.standing_in_A, 'standing buildings inside runout reach zone A', 'wide']])}</div>
  <div class="callout small"><b>Reported on the ground</b> (${esc(rep.source)}):<ul>${lis(rep.lines.map(esc))}</ul></div>
  <h2>Key findings</h2><ul class="f">${lis(finds)}</ul>`;
}
function landslidesSite(k){
  const x = S(k), rows = SITES[k].landslides;
  const major = rows.filter(r => r.type !== 'minor'), minor = rows.filter(r => r.type === 'minor');
  return `<h2>${rows.length} landslides at ${esc(x.name)}</h2>
  <p class="small sec">Mapped area of each landslide split by the pre-event slope it lies on: the steep <b>source</b> zone (&ge; 20&deg;), the <b>transport</b> zone (8&ndash;20&deg;), and <b>runout</b> on flat ground (&lt; 8&deg;). Click a bar or row to zoom.</p>
  <div id="zone-key"></div><div class="chart" id="c-zone"></div>
  <table><thead><tr><th>ID</th><th class="n">Area m²</th><th class="n">H m</th><th class="n">L m</th><th class="n">Reach</th><th class="n">Destr.</th><th class="n">Dam.</th></tr></thead><tbody>
  ${major.map(r => `<tr class="click" data-k="${k}" data-id="${r.id}" title="${esc(r.description)}"><td><b>${r.id}</b> <span class="small muted">${r.type === 'channel' ? 'channel' : 'open'}</span><br><span class="muted small">${esc(r.name)}</span></td><td class="n">${fmt(r.area_m2)}</td><td class="n">${fmt(r.H_m)}</td><td class="n">${fmt(r.L_m)}</td><td class="n">${r.reach_angle_deg}&deg;${r.crown_at_edge || r.toe_at_edge ? '*' : ''}</td><td class="n">${r.destroyed || '&ndash;'}</td><td class="n">${r.damaged || '&ndash;'}</td></tr>`).join('')}
  ${minor.length ? `<tr><td colspan="7" class="small muted">${minor.length} minor scars: ${minor.map(r => `<a href="#" data-k="${k}" data-id="${r.id}" class="zl">${r.id}</a>`).join(', ')} (${fmt(minor.reduce((a,r) => a + r.area_m2, 0))} m²)</td></tr>` : ''}
  <tr><td><b>Total</b></td><td class="n"><b>${fmt(x.area_total_m2)}</b></td><td></td><td></td><td></td><td class="n"><b>${rows.reduce((a,r) => a + r.destroyed, 0)}</b></td><td class="n"><b>${rows.reduce((a,r) => a + r.damaged, 0)}</b></td></tr></tbody></table>
  <p class="small muted">H = drop from crown to toe; L = horizontal distance; reach angle = atan(H/L), all from the pre-event Copernicus 30 m DEM. * the scar runs beyond the surveyed area, so H and L are minimums.${k === 'kdnh' ? ` Beyond the corridor mouth, ${fmt(x.outwash_m2)} m² of paddy under sediment is mapped separately.` : ''}${k === 'tby' ? ` ${fmt(x.outwash_m2)} m² of village and fields under sediment (TB-OW1, TB-OW2) is mapped separately, with building footprints cut out.` : ''}${k === 'kdg' ? ` ${fmt(x.outwash_m2)} m² of fields under sediment (KG-OW, the eastern end of Ka Det Nge Htein's fan) is mapped separately.` : ''}${k === 'pgz' ? ` ${fmt(x.outwash_m2)} m² of fields under sediment at the north-west valley mouth (PG-OW1) is mapped separately.` : ''}${k === 'rbe' ? ` ${fmt(x.outwash_m2)} m² of fields under sand east of the road (RB-OW) is mapped separately.` : ''}${k === 'thw' ? ` ${fmt(x.outwash_m2)} m² of village, fields and paddy under sediment (TW-OW1 to TW-OW5) is mapped separately.` : ''}${k === 'lhl' ? ` ${fmt(x.outwash_m2)} m² of gardens under LL-01's fan east of the road (LL-OW1) is mapped separately.` : ''}</p>`;
}
function buildingsSite(k){
  const x = S(k), bs = x.buildings_status, rows = SITES[k].landslides.filter(r => r.destroyed + r.damaged + r.edge), sh = x.footprint_shift;
  const shTxt = sh.manual ? `by ${sh.dE} m E, ${sh.dN} m N, set by eye (the automatic roof match gave ${sh.auto_dE} m E, ${sh.auto_dN} m N, pulled off the roofs by bare grey yards)` : k === 'tawkye' ? `per flight (landslide flight ${sh.landslide.dE} m E, ${sh.landslide.dN} m N; Plan-2 ${sh.plan2.dE} m E, ${sh.plan2.dN} m N)` : `by ${sh.dE >= 0 ? '+' : ''}${sh.dE} m E, ${sh.dN} m N (roof match ${Math.round(sh.grey_before*100)}% &rarr; ${Math.round(sh.grey_after*100)}%)`;
  const note = {thw: `Eleven automatic labels were changed after inspecting image chips: three buildings that stood on 10 Jan (one a round hut or tank) are gone under sand and became <b>destroyed</b>; a hut whose white roof fell inside the flow outline, and four buildings whose yards were already bare in January, became <b>clear</b>; three footprints on canopy or a field were dropped. Footprints inside the 2 Oct Taw Kye survey are left to Taw Kye.`,
    lhl: `Three automatic labels were changed after inspecting image chips: two intact roofs at the mouth of LL-01, caught by the outline or read as soil, became <b>clear</b> and <b>at edge</b>, and one Microsoft footprint on canopy was dropped.`,
    rbe: `Only five footprints (all OpenStreetMap) fall in the survey; one on canopy was dropped after inspecting image chips. The fitted roof shift was checked by eye and puts the other four on their roofs.`,
    pgz: `Ten automatic labels were changed after inspecting image chips: two roofs now under boulders (which read as roof-grey) became <b>destroyed</b>, one intact roof whose yard is bare became <b>at edge</b>, one footprint drawn on a yard was dropped, and six Microsoft footprints on canopy or grass were dropped.`,
    kdg: `Three Microsoft footprints on canopy were dropped after inspecting image chips. OpenStreetMap footprints sit on the drone roofs; Microsoft ones are scattered 3&ndash;10 m off, so every footprint within 30 m of a landslide or the sediment was checked by eye.`,
    pny: `Only six Microsoft footprints fall in or near the survey and none from OpenStreetMap. Four sit on canopy or grass in both images and were dropped; the one real building is a hut by the road (a second hut beside it has no footprint). The roof-match shift could not be fitted reliably on so few roofs and does not affect the result.`,
    tby: `Thirteen automatic labels were changed after inspecting image chips against the Esri image of 10 Jan 2026: twelve Microsoft footprints on tree crowns, grass or a yard were dropped, and one roof that stood in January at the toe of the fan, now only sand, became <b>destroyed</b>. Every footprint standing in sediment was checked. The Microsoft footprints also miss some roofs visible in the village, so the counts are minimums.`,
    kdnh: `Thirteen automatic labels were changed after inspecting image chips: eleven roofless footprints under pale sand (which classifies as grey, like a roof) and one wrecked building at the corridor edge became <b>destroyed</b>; one Microsoft footprint with no building in either image was dropped.`,
    nmt: `The one damaged building, beside the west river channel, was confirmed on its image chip.`,
    tawkye: `10 automatic labels were changed after inspecting image chips (collapsed or displaced roofs, a rusty roof read as soil); the reason is in each popup.`}[k];
  return `<h2>Building damage at ${esc(x.name)}</h2>
  <p class="small sec">${x.buildings_surveyed} pre-event building footprints (OpenStreetMap plus Microsoft ML footprints) fall inside the drone survey, each checked against the post-event orthomosaic at full resolution.</p>
  <div class="tiles">${['destroyed','damaged','edge',...(bs.outwash ? ['outwash'] : []),'clear'].map(s => `<div class="tile"><div class="v">${bs[s] || 0}</div><div class="l">${sw(ST[s][1])} ${ST[s][0]}</div></div>`).join('')}</div>
  ${x.report.houses ? `<div class="callout small">Reported: <b>${esc(x.report.houses_label || x.report.houses + ' houses destroyed')}</b>. The drone shows <b>${bs.destroyed}</b> footprints with no roof left and <b>${bs.damaged || 0}</b> standing in debris. Footprint sets miss some buildings and count sheds separately, so the counts agree in scale rather than exactly.</div>` : ''}
  ${rows.length ? `<h3>By landslide</h3><table><thead><tr><th>Landslide</th><th class="n">Destroyed</th><th class="n">Damaged</th><th class="n">At edge</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="click" data-k="${k}" data-id="${r.id}"><td>${r.id} <span class="muted small">${esc(r.name)}</span></td><td class="n">${r.destroyed || '&ndash;'}</td><td class="n">${r.damaged || '&ndash;'}</td><td class="n">${r.edge || '&ndash;'}</td></tr>`).join('')}</tbody></table>` : ''}
  <h3>How the status is decided</h3>
  <p class="small sec">Footprints were first shifted onto the ortho's roofs ${shTxt}. Inside each footprint, shrunk by 0.5 m, pixels were counted as roof-grey, soil, vegetation or shadow. <b>Destroyed</b>: &ge; 30% inside a landslide with &lt; 30% roof and &ge; 40% soil. <b>Damaged</b>: &ge; 30% inside with a roof still visible. <b>At edge</b>: within 10 m.${bs.outwash ? ` <b>Standing in sediment</b>: ${k === 'tby' ? '&ge; 30% of a 3 m ring around the footprint' : '&ge; 30% of the footprint'} under the mapped sediment.` : ''} ${note}</p>`;
}
function runoutSite(k){
  const x = S(k), ro = x.runout, R = x.reach;
  const ids = ro.open_ids.join(', '), chIds = String(ro.channel_id).split('+');
  const chTxt = chIds.length > 1 ? `debris from ${chIds[0]}'s crown to the toe of ${chIds[1]}, which it joined,` : `channelised ${esc(ro.channel_id)}`;
  return `<h2>Where else could debris reach at ${esc(x.name)}?</h2>
  <p class="small sec">The open-slope flows here (${esc(ids)}) stopped where the line from their crown fell to about <b>${ro.alpha_open}&deg;</b>; the ${chTxt} ran out at <b>${ro.alpha_channel}&deg;</b>. Spreading debris downslope from every slope &ge; ${ro.src_slope}&deg; with those angles marks where a similar flow could still get to. <b>Zone A</b>: reachable by an open-slope flow; <b>zone B</b>: only by a channelised one.${ro.clip_m ? ` Zones are shown within ${ro.clip_m} m of the survey.` : ''}</p>
  <div class="seg" role="group"><button class="zbtn" aria-pressed="false">Show reach zones on the map</button></div>
  <div class="tiles">${tiles([[R.standing_in_A, 'standing buildings in zone A'], [R.standing_in_B, 'standing buildings in zone B only'],
    [R.standing_outside, 'standing buildings outside both'], [`${R.affected_in_AB ?? R.affected_in_A} of ${R.affected}`, 'destroyed + damaged buildings inside the zones']])}</div>
  <h3>Calibration check</h3>
  <p class="small sec">Share of each calibration landslide that falls inside its modelled reach:</p>
  <table><thead><tr><th>Landslide</th><th class="n">Inside reach</th></tr></thead><tbody>${Object.entries(ro.calibration_share_inside)
    .map(([i,v]) => `<tr><td>${i}${chIds.includes(i) ? ` <span class="muted small">(zone A + B${chIds.length > 1 ? ', channel path' : ''})</span>` : ''}${i === 'LS-01' || (chIds.length > 1 && i === chIds[1]) ? ' <span class="muted small">(source outside survey)</span>' : ''}</td><td class="n">${fmt(v*100)}%</td></tr>`).join('')}</tbody></table>
  ${k === 'tby' ? `<div class="callout small"><b>The model misses what happened here.</b> TB-01 and TB-05 reached the village, but on the 30 m DEM the valley floor north of it is flat and lumpy (forest canopy), and the model only moves debris to lower ground, so it stalls there at any angle &mdash; even at 3&deg; only 55% of TB-01 is covered. None of the ${R.affected} destroyed or damaged buildings, and none of the ${S('tby').buildings_status.outwash} standing in sediment, are inside the zones. Treat the whole valley floor below the ridge as exposed.</div>` : ''}
  <div class="callout small"><b>Read this as screening, not a zoning map.</b> 30 m pre-event DEM, no volume, velocity or obstacles; every slope &ge; 20&deg; is a possible source. Siting decisions need a field assessment by GSM or another qualified team.</div>`;
}

    ${P.map(([v,c]) => `<figure data-v="${v}"><div class="seg" role="group"><button aria-pressed="true" data-w="before">Before (Dec 2023)</button><button aria-pressed="false" data-w="after">After (Oct 2026)</button></div>

  <div class="views">${VIEWS[k].map(([n,b,c],i) => `<div class="view" data-i="${i}"><div><b>${esc(n)}</b><span class="small sec">${esc(c)}</span></div></div>`).join('')}</div>
  <div class="seg" role="group"><button data-w="after" class="ib">Show after</button><button data-w="before" class="ib">Show before</button></div>`;
}

  const qa = {
    thw:  [`The four flights come already mosaicked into one image, so their overlaps could not be compared; the mosaic is used as delivered. Vegetation threshold ExG &ge; 0.045, the valley of the delivery's excess-green histogram (both blocks pooled: the Lel Hla block's alone is flat).`,

           `The channel zone was split into 8-connected bare components &ge; 20 m², grouped when within 6 m (canopy over a channel breaks it into pieces), keeping groups &ge; 200 m². 0.6 ha in smaller pieces is not mapped.`,
           `${x.n_exclusions} exclusions: a monastery compound, a road, a pagoda compound and an excavation already bare on 10 Jan 2026, and 7 groups rejected on image chips. The last ~100 m of the flight's east edge is smeared and was left out.`],
    tawkye: [`Pixel-count and vector areas agree within 0.1% for every landslide. The two flights disagree by 2.8 m in their 3 ha overlap; the finer flight is used there.`,
             `Every destroyed, damaged and edge building was checked on an image chip; 10 labels were overridden.`]}[k];
  const lim = {
    thw:  [`Connected channels are grouped, so TZ-01, TZ-02, TZ-03 and TZ-05 are networks of several flows; their drops, lengths and reach angles describe the network, not one flow.`,

           `The orange mud on the paddies east of the road (TW-OW4) may include flood sediment as well as debris from the valley. Model rainfall is the same grid cell as Lel Hla. Georeferencing is GNSS-only; heights carry roughly &plusmn;10 m from the 30 m pre-event DEM.`],

/* ---------- render ---------- */
function bindCommon(pane){
  pane.querySelectorAll('tr.click[data-k]').forEach(tr => tr.onclick = () => {
    if (tr.dataset.id) zoomTo(tr.dataset.k, tr.dataset.id); else { site = tr.dataset.k; go(true); } });
  pane.querySelectorAll('a.zl').forEach(a => a.onclick = e => { e.preventDefault(); zoomTo(a.dataset.k, a.dataset.id); });
  pane.querySelectorAll('.zbtn').forEach(b => b.onclick = () => { const on = !map.hasLayer(zoneL); on ? zoneL.addTo(map) : map.removeLayer(zoneL);
    if (on){ bL.eachLayer(l => l.bringToFront()); slideL.eachLayer(l => l.bringToFront()); } syncZoneBtn(); });
  pane.querySelectorAll('.view[data-k]').forEach(v => v.onclick = () => { site = v.dataset.k; go(true); });
  pane.querySelectorAll('.view[data-i]').forEach(v => v.onclick = () => { const b = VIEWS[site][+v.dataset.i][1]; map.fitBounds([[b[1],b[0]],[b[3],b[2]]]); });
  pane.querySelectorAll('.ib').forEach(b => b.onclick = () => setImg(b.dataset.w));
  pane.querySelectorAll('figure[data-v]').forEach(fg => fg.querySelectorAll('button').forEach(b => b.onclick = () => {
    fg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); fg.querySelector('img').src = `assets/tawkye/video_${fg.dataset.v}_${b.dataset.w}.jpg`; }));
}
function syncZoneBtn(){ const on = map.hasLayer(zoneL); document.querySelectorAll('.zbtn').forEach(b => { b.setAttribute('aria-pressed', on); b.textContent = on ? 'Hide reach zones' : 'Show reach zones on the map'; }); }
function render(refit){
  document.querySelectorAll('#sites button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === site));
  tabBtns.forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + tab));
  const all = site === 'all';
  const html = {overview: all ? overviewAll : overviewSite, landslides: all ? landslidesAll : landslidesSite, buildings: all ? buildingsAll : buildingsSite,
                runout: all ? runoutAll : runoutSite, imagery: all ? imageryAll : imagerySite, method: all ? methodAll : methodSite}[tab](site);
  const pane = $('#p-' + tab); pane.innerHTML = html; bindCommon(pane);
  if ($('#c-reach')) reachChart($('#c-reach'), SK);
  if ($('#c-area')) siteAreaChart($('#c-area'));
  if ($('#c-rain')) rainChart($('#c-rain'));
  if ($('#c-zone')) $('#zone-key').innerHTML = zoneChart($('#c-zone'), site);
  syncZoneBtn(); drawLegend();
  if (refit) fitSite(site);
  setTimeout(() => map.invalidateSize(), 0);
}
parseHash();
render(true);
gateLabels();
addEventListener('hashchange', () => { const s0 = site; parseHash(); render(site !== s0); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render(false));
})();
</script>

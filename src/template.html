<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --hair:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --accent:#2a78d6;
  --z-source:#86b6ef; --z-transport:#2a78d6; --z-runout:#104281;
  --s-destroyed:#d03b3b; --s-damaged:#ec835a; --s-edge:#fab219; --s-clear:#898781;
  --zoneA:#4a3aa7; --rain:#2a78d6;
  --site-kdnh:#2a78d6; --site-nmt:#eb6834; --site-tawkye:#1baf7a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --hair:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --accent:#3987e5;
    --z-source:#184f95; --z-transport:#3987e5; --z-runout:#9ec5f4;
    --zoneA:#9085e9; --rain:#3987e5;
    --site-kdnh:#3987e5; --site-nmt:#d95926; --site-tawkye:#199e70;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --hair:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --accent:#3987e5;
  --z-source:#184f95; --z-transport:#3987e5; --z-runout:#9ec5f4;
  --zoneA:#9085e9; --rain:#3987e5;
  --site-kdnh:#3987e5; --site-nmt:#d95926; --site-tawkye:#199e70;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
.tk{display:flex;flex-direction:column;height:100vh;height:100dvh}
.tk header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--hair);background:var(--surface);flex-wrap:wrap}
.tk header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
.tk header p{margin:0;color:var(--ink-2);font-size:12.5px}
.tk header .sp{flex:1}
.btn{font:inherit;font-size:12.5px;border:1px solid var(--ring);background:var(--surface-2);color:var(--ink);
  border-radius:8px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--axis)}
.sites{display:inline-flex;border:1px solid var(--ring);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.sites button{font:inherit;font-size:12.5px;border:0;background:var(--surface-2);color:var(--ink-2);padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sites button+button{border-left:1px solid var(--ring)}
.sites button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.main{flex:1;display:flex;min-height:0}
.mapwrap{flex:1;min-width:0;position:relative}
#map{position:absolute;inset:0;background:#222}
.panel{width:460px;max-width:48vw;display:flex;flex-direction:column;border-left:1px solid var(--hair);background:var(--surface);min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;font-size:13px;background:none;border:0;color:var(--ink-2);padding:7px 8px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.pane{display:none;overflow-y:auto;padding:14px 16px 28px;flex:1}
.pane.on{display:block}
h2{font-size:15px;margin:18px 0 6px;font-weight:650}
h2:first-child{margin-top:2px}
h3{font-size:12px;margin:16px 0 4px;font-weight:650;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
p{margin:6px 0}
.muted{color:var(--muted)} .sec{color:var(--ink-2)}
.small{font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tile .v{font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.tile .l{font-size:12px;color:var(--ink-2)}
.tile.wide{grid-column:span 2}
.callout{border-left:3px solid var(--axis);padding:6px 10px;margin:10px 0;background:var(--surface-2);border-radius:0 8px 8px 0}
.callout ul{margin:4px 0;padding-left:16px}
ul.f{padding-left:18px;margin:6px 0} ul.f li{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:11.5px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.key{display:inline-flex;align-items:center;gap:6px;margin:2px 12px 2px 0;font-size:12px;color:var(--ink-2)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.chart{position:relative;margin:6px 0 4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:10.5px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:5px 8px;border-radius:6px;
  white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .08s;z-index:5}
.tip.on{opacity:1}
figure{margin:10px 0 16px} figure img{width:100%;display:block;border-radius:8px}
figcaption{font-size:12px;color:var(--ink-2);margin-top:5px}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:8px;overflow:hidden;margin:6px 0}
.seg button{font:inherit;font-size:12px;border:0;background:var(--surface-2);color:var(--ink-2);padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.views{display:grid;gap:8px;margin:8px 0}
.view{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:9px 11px;cursor:pointer;border:1px solid transparent}
.view:hover{border-color:var(--axis)}
.view b{display:block;font-size:13px}
.legend-box{background:var(--surface);color:var(--ink);padding:8px 10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:12px;line-height:1.6;max-width:230px}
.legend-box .sw{vertical-align:-1px;margin-right:6px}
.imgctl{background:var(--surface);color:var(--ink);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex;overflow:hidden}
.imgctl button{font:inherit;font-size:12px;border:0;background:var(--surface);color:var(--ink-2);padding:6px 10px;cursor:pointer}
.imgctl button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.lbl{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:700;font-size:12px;text-shadow:0 0 3px #000,0 0 2px #000}
.lbl::before{display:none}
.slbl{background:rgba(0,0,0,.6);border:0;color:#fff;font-weight:650;font-size:12.5px;box-shadow:none;padding:2px 7px;border-radius:5px}
.slbl::before{display:none}
.vlbl{background:rgba(0,0,0,.55);border:0;color:#fff;font-size:11.5px;box-shadow:none;padding:1px 5px}
.vlbl::before{display:none}
.lowz .vlbl{display:none}
.leaflet-popup-content{font-size:12.5px;line-height:1.45;margin:10px 12px}
.leaflet-popup-content b{font-weight:650}
.leaflet-control-layers{font-size:12.5px}
a{color:var(--accent)}
@media (max-width:820px){
  .main{flex-direction:column}
  .mapwrap{flex:none;height:52vh}
  .panel{width:auto;max-width:none;border-left:0;border-top:1px solid var(--hair);flex:1}
  .tk header p{display:none}
  .tk header{gap:8px;padding:8px 12px}
  .tk header .sp{display:none}
  .tk header > div:first-child{flex:1;min-width:0}
  .sites{order:3;width:100%;display:flex}
  .sites button{flex:1 1 auto;justify-content:center;padding:6px 4px;font-size:11.5px}
  .legend-box{display:none}
  .tk,.main,.panel{max-width:100vw;overflow-x:hidden}
}
</style>

<div class="tk">
  <header>
    <div>
      <h1>Launglon landslides, 26&ndash;27 Sep 2026</h1>
      <p>Three drone-surveyed villages, Launglon Township, Tanintharyi Region, Myanmar</p>
    </div>
    <div class="sp"></div>
    <div class="sites" role="group" aria-label="Site" id="sites"></div>
    <button class="btn" id="theme" title="Switch light / dark">Theme</button>
  </header>
  <div class="main">
    <div class="mapwrap"><div id="map" role="region" aria-label="Map"></div></div>
    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-t="overview">Overview</button>
        <button role="tab" data-t="landslides">Landslides</button>
        <button role="tab" data-t="buildings">Buildings</button>
        <button role="tab" data-t="runout">Runout</button>
        <button role="tab" data-t="imagery">Before / after</button>
        <button role="tab" data-t="method">Method</button>
      </nav>
      <section class="pane" id="p-overview"></section>
      <section class="pane" id="p-landslides"></section>
      <section class="pane" id="p-buildings"></section>
      <section class="pane" id="p-runout"></section>
      <section class="pane" id="p-imagery"></section>
      <section class="pane" id="p-method"></section>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
const D = /*__DATA__*/null;
const SK = ['kdnh','nmt','tawkye'], SITES = D.sites, T = D.total;
const $ = s => document.querySelector(s);
const fmt = (x,d=0) => Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const ha = m2 => fmt(m2/1e4, 1);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S = k => SITES[k].summary;
const NAME = k => S(k).name;
const dateTxt = s => { const [y,m,d] = s.split('-'); return `${+d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]} ${y}`; };
const TYPE = {open:'Open-slope slide', channel:'Scoured channel / gully', minor:'Minor scar'};
const ST = {destroyed:['Destroyed','--s-destroyed'], damaged:['Damaged, standing','--s-damaged'], edge:['Standing at the edge','--s-edge'],
            outwash:['Standing in sediment','--s-edge'], clear:['Standing, clear','--s-clear']};
const sw = v => `<span class="sw" style="background:${css(v)}"></span>`;
const siteDot = k => `<span class="dot" style="background:${css('--site-'+k)}"></span>`;
const tiles = arr => arr.map(([v,l,w]) => `<div class="tile ${w||''}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
const lis = arr => arr.map(s => `<li>${s}</li>`).join('');
const allRows = SK.flatMap(k => SITES[k].landslides.map(r => ({...r, site:k})));

/* ---------- state: #site/tab ---------- */
let site = 'all', tab = 'overview';
const TABS = ['overview','landslides','buildings','runout','imagery','method'];
function parseHash(){ const [a,b] = location.hash.slice(1).split('/');
  site = ['all', ...SK].includes(a) ? a : 'all'; tab = TABS.includes(b) ? b : (TABS.includes(a) ? a : 'overview'); }

/* ---------- theme ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('ll-theme'); if (t) root.dataset.theme = t; } catch(e){}
$('#theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('ll-theme', root.dataset.theme); } catch(e){}
  render(false);
};

/* ---------- map ---------- */
const map = L.map('map', {zoomControl:true, maxZoom:23});
const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:23, maxNativeZoom:19, attribution:'Basemap: Esri World Imagery (Vantor Vivid, 10 Jan 2026 here: pre-event)'}).addTo(map);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:23, maxNativeZoom:19, attribution:'&copy; OpenStreetMap contributors'});
const fpB = k => L.geoJSON(SITES[k].geo.footprint).getBounds();
const kadetB = fpB('kdnh').extend(fpB('nmt'));
const droneKadet = L.tileLayer('tiles/kadet/{z}/{x}/{y}.webp', {tileSize:512, zoomOffset:-1, minNativeZoom:14, maxNativeZoom:21,
  maxZoom:23, bounds:kadetB.pad(0.02), attribution:'Drone orthomosaics 3 &amp; 4 Oct 2026'});
const droneTK = L.tileLayer('tiles/tawkye/{z}/{x}/{y}.webp', {tileSize:512, zoomOffset:-1, minNativeZoom:14, maxNativeZoom:22,
  maxZoom:23, bounds:fpB('tawkye').pad(0.02), attribution:'Drone orthomosaics 2 Oct 2026 (GSM/TSBM)'});
const drone = L.layerGroup([droneKadet, droneTK]).addTo(map);

const C = D.ctx;
const tsL = L.geoJSON(C.township, {style:{color:'#ffffff', weight:2, opacity:.8, fill:false}});
const vtL = L.geoJSON(C.vt, {style:{color:'#ffffff', weight:1.2, opacity:.7, dashArray:'4 4', fill:false},
  onEachFeature:(f,l) => l.bindPopup(`<b>${esc(f.properties.VT)}</b> village tract<br>${esc(f.properties.VT_MMR)}<br><span class="muted">${esc(f.properties.VT_PCODE)}</span>`)}).addTo(map);
const roadL = L.geoJSON(C.roads, {style:{color:'#f2f1ed', weight:2, opacity:.6}});
const villL = L.geoJSON(C.villages, {pointToLayer:(f,ll) => L.circleMarker(ll, {radius:5, color:'#fff', weight:1.5, fillColor:'#0b0b0b', fillOpacity:1}),
  onEachFeature:(f,l) => { l.bindTooltip(`${esc(f.properties.VILLAGE)} ${esc(f.properties.VLG_MMR)}`, {permanent:true, direction:'right', className:'vlbl', offset:[6,0]});
    l.bindPopup(`<b>${esc(f.properties.VILLAGE)}</b> ${esc(f.properties.VLG_MMR)}<br>Village tract: ${esc(f.properties.VT)}<br>MIMU PCode ${esc(f.properties.VLG_PCODE)}`); }}).addTo(map);
const schL = L.geoJSON(C.schools, {pointToLayer:(f,ll) => L.circleMarker(ll, {radius:4, color:'#fff', weight:1, fillColor:'#2a78d6', fillOpacity:1}),
  onEachFeature:(f,l) => l.bindPopup(`School: ${esc(f.properties.schoolname)} (MIMU)`)});

const byKey = {};
SK.forEach(k => SITES[k].landslides.forEach(r => byKey[k + '|' + r.id] = r));
const slideStyle = t => t === 'channel' ? {color:'#eda100', weight:1.6, dashArray:'5 3', fillColor:'#eda100', fillOpacity:.10}
  : t === 'minor' ? {color:'#eda100', weight:1, fillColor:'#eda100', fillOpacity:.08} : {color:'#eda100', weight:1.6, fillColor:'#eda100', fillOpacity:.12};
const G = {slides:[], labels:[], ct:[], outwash:[], excl:[], bld:[], zones:[], fp:[]};
const slideIdx = {};
SK.forEach(k => {
  const g = SITES[k].geo, nm = NAME(k);
  G.slides.push(L.geoJSON(g.landslides, {style:f => slideStyle(f.properties.type),
    onEachFeature:(f,l) => { const r = byKey[k + '|' + f.properties.id]; slideIdx[k + '|' + r.id] = l;
      l.bindPopup(`<b>${r.id} &middot; ${esc(r.name)}</b> <span class="muted">${esc(nm)}</span><br>${esc(TYPE[r.type])}. ${esc(r.description)}<br>`
        + `Area <b>${fmt(r.area_m2)} m²</b> (${ha(r.area_m2)} ha)` + (r.type !== 'minor' ? ` &middot; drop ${fmt(r.H_m)} m over ${fmt(r.L_m)} m (reach angle ${r.reach_angle_deg}&deg;${r.crown_at_edge || r.toe_at_edge ? ', runs beyond the survey' : ''})` : '')
        + (r.destroyed + r.damaged ? `<br>Buildings: ${r.destroyed} destroyed, ${r.damaged} damaged` : '')); }}));
  G.labels.push(L.layerGroup(SITES[k].landslides.filter(r => r.type !== 'minor').map(r => L.marker([r.label[1], r.label[0]], {opacity:0, interactive:false})
    .bindTooltip(r.id, {permanent:true, direction:'center', className:'lbl'}))));
  G.ct.push(L.layerGroup(SITES[k].landslides.filter(r => r.type !== 'minor').flatMap(r => [
    L.circleMarker([r.crown[1], r.crown[0]], {radius:4, color:'#000', weight:1, fillColor:'#eda100', fillOpacity:1}).bindPopup(`${r.id} crown, ${r.crown_z} m`),
    L.circleMarker([r.toe[1], r.toe[0]], {radius:4, color:'#000', weight:1, fillColor:'#ffffff', fillOpacity:1}).bindPopup(`${r.id} toe, ${r.toe_z} m`)])));
  if (g.outwash) G.outwash.push(L.geoJSON(g.outwash, {style:{color:'#e87ba4', weight:1.2, fillColor:'#e87ba4', fillOpacity:.22},
    onEachFeature:(f,l) => l.bindPopup(`<b>Fields under sediment</b> &middot; ${esc(nm)}<br>${fmt(f.properties.area_m2)} m² of paddy beyond the debris-flow mouth under fresh sediment or muddy water. Mapped apart; not counted as landslide area.`)}));
  if (g.exclusions) G.excl.push(L.geoJSON(g.exclusions, {style:{color:'#ffffff', weight:1.2, dashArray:'3 3', fillColor:'#ffffff', fillOpacity:.08},
    onEachFeature:(f,l) => l.bindPopup(`<b>Excluded: ${esc(f.properties.name)}</b><br>${esc(f.properties.description)}`)}));
  G.zones.push(L.geoJSON(g.zones, {style:f => ({color:css('--zoneA'), weight:f.properties.zone === 'A' ? 1.5 : 1,
    fillColor:css('--zoneA'), fillOpacity:f.properties.zone === 'A' ? .30 : .12, opacity:.9}),
    onEachFeature:(f,l) => l.bindPopup(`<b>Zone ${f.properties.zone}</b> &middot; ${esc(nm)}<br>${esc(f.properties.label)}`)}));
  G.fp.push(L.geoJSON(g.footprint, {style:{color:'#7fdbff', weight:1.2, opacity:.9, fill:false}}));
  G.bld.push(L.geoJSON(g.buildings, {style:f => { const s = f.properties.status, c = css(ST[s][1]);
      return s === 'clear' ? {color:'#ffffff', weight:1, opacity:.75, fillOpacity:0} : {color:c, weight:1.5, fillColor:c, fillOpacity:.4}; },
    onEachFeature:(f,l) => { const p = f.properties;
      l.bindPopup(`<b>${esc(ST[p.status][0])}</b> &middot; ${esc(p.bid)}<br>${p.landslide ? 'Landslide ' + esc(p.landslide) + ' &middot; ' : ''}${fmt((p.overlap||0)*100)}% inside outline<br>`
        + `Inside footprint: roof-grey ${fmt((p.f_grey||0)*100)}%, soil ${fmt((p.f_soil||0)*100)}%, vegetation ${fmt((p.f_veg||0)*100)}%`
        + (p.note ? `<br><i>Checked by eye: ${esc(p.note)}</i>` : '') + (p.reach ? `<br>Runout reach zone ${p.reach}` : '')
        + `<br><span class="muted">Footprint: ${esc(p.source)}</span>`); }}));
});
const grp = a => L.layerGroup(a);
const slideL = grp(G.slides).addTo(map), labelL = grp(G.labels), ctL = grp(G.ct), owL = grp(G.outwash).addTo(map),
      exL = grp(G.excl), bL = grp(G.bld).addTo(map), zoneL = grp(G.zones), fpL = grp(G.fp).addTo(map);
const siteLbl = L.layerGroup(SK.map(k => { const b = fpB(k); return L.marker([b.getNorth(), b.getCenter().lng], {opacity:0, interactive:false})
  .bindTooltip(NAME(k), {permanent:true, direction:'top', className:'slbl'}); })).addTo(map);
L.control.layers({'Esri imagery (pre-event)':esri, 'OpenStreetMap':osm}, {
  'Drone orthomosaics, 2-4 Oct 2026':drone, 'Landslide outlines':slideL, 'Landslide labels (zoom in)':labelL, 'Crown / toe points':ctL,
  'Fields under sediment':owL, 'Ground bare before the event (excluded)':exL, 'Buildings by status':bL, 'Runout reach zones':zoneL,
  'Drone survey extents':fpL, 'Site names':siteLbl, 'MIMU villages':villL, 'MIMU village tracts':vtL, 'MIMU township':tsL,
  'MIMU roads':roadL, 'MIMU schools':schL}, {collapsed:true}).addTo(map);
L.control.scale({imperial:false}).addTo(map);
let userLabels = false;
map.on('overlayadd overlayremove', e => { if (e.layer === labelL) userLabels = e.type === 'overlayadd'; syncZoneBtn(); syncImg(); });
function gateLabels(){ const z = map.getZoom(); map.getContainer().classList.toggle('lowz', z < 14); if (z >= 16 && !map.hasLayer(labelL)) labelL.addTo(map); else if (z < 16 && map.hasLayer(labelL) && !userLabels) map.removeLayer(labelL);
  if (z >= 15 && map.hasLayer(siteLbl)) map.removeLayer(siteLbl); else if (z < 15 && !map.hasLayer(siteLbl)) siteLbl.addTo(map); }
map.on('zoomend', gateLabels);

/* before / after imagery control */
const imgCtl = L.control({position:'topright'});
imgCtl.onAdd = () => { const d = L.DomUtil.create('div', 'imgctl');
  d.innerHTML = `<button data-v="after" aria-pressed="true" title="Drone orthomosaics, 2-4 Oct 2026">After (drone)</button><button data-v="before" aria-pressed="false" title="Esri World Imagery: Vantor Vivid, 10 Jan 2026">Before (Jan 2026)</button>`;
  L.DomEvent.disableClickPropagation(d);
  d.querySelectorAll('button').forEach(b => b.onclick = () => setImg(b.dataset.v)); return d; };
imgCtl.addTo(map);

function syncImg(){ const after = map.hasLayer(drone); document.querySelectorAll('.imgctl button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.v === 'after') === after)); }

/* ---------- charts ---------- */
function tipFor(box){ let t = box.querySelector('.tip'); if (!t){ t = document.createElement('div'); t.className = 'tip'; box.appendChild(t);} return t; }
function hover(box, sel, text){ const tip = tipFor(box);
  box.querySelectorAll(sel).forEach(el => { el.onmouseenter = () => { tip.innerHTML = text(el); const bb = el.getBoundingClientRect(), bx = box.getBoundingClientRect();
      tip.style.left = (bb.left - bx.left + bb.width/2) + 'px'; tip.style.top = (bb.top - bx.top) + 'px'; tip.classList.add('on'); };
    el.onmouseleave = () => tip.classList.remove('on'); }); }

function reachChart(box, keys){
  // one row per site; each non-minor landslide a dot at its reach angle. Filled = open slope, ring = channel; faint = runs beyond survey
  const W = 420, rh = 46, m = {l:104, r:14, t:8, b:30}, H = m.t + m.b + keys.length*rh, X0 = 0, X1 = 32;
  const x = v => m.l + (W - m.l - m.r) * (v - X0) / (X1 - X0);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Reach angle of each mapped landslide, by site">`;
  for (let v = 0; v <= X1; v += 5) s += `<line x1="${x(v)}" x2="${x(v)}" y1="${m.t}" y2="${H-m.b}" stroke="${css(v ? '--hair' : '--axis')}"/><text x="${x(v)}" y="${H-m.b+14}" text-anchor="middle">${v}&deg;</text>`;
  s += `<text x="${W-m.r}" y="${H-4}" text-anchor="end">reach angle = atan(drop / horizontal distance); lower travels further</text>`;
  const pts = [];
  keys.forEach((k,i) => { const yc = m.t + i*rh + rh/2, col = css('--site-'+k), ro = S(k).runout;
    s += `<text x="${m.l-8}" y="${yc+4}" text-anchor="end" style="fill:${css('--ink-2')};font-size:11.5px">${esc(NAME(k))}</text>`;
    s += `<line x1="${x(ro.alpha_open)}" x2="${x(ro.alpha_open)}" y1="${yc-17}" y2="${yc+17}" stroke="${css('--ink-2')}" stroke-width="1.5"/>`;
    s += `<line x1="${x(ro.alpha_channel)}" x2="${x(ro.alpha_channel)}" y1="${yc-17}" y2="${yc+17}" stroke="${css('--ink-2')}" stroke-width="1.5" stroke-dasharray="3 2"/>`;
    SITES[k].landslides.filter(r => r.type !== 'minor').forEach((r,j) => { const edge = r.crown_at_edge || r.toe_at_edge, dy = (r.type === 'open' ? -7 : 7);
      const cx = x(Math.min(r.reach_angle_deg, X1)), cy = yc + dy;
      s += r.type === 'open'
        ? `<circle cx="${cx}" cy="${cy}" r="5" fill="${col}" stroke="${css('--surface')}" stroke-width="2" opacity="${edge ? .4 : 1}"/>`
        : `<circle cx="${cx}" cy="${cy}" r="4.5" fill="${css('--surface')}" stroke="${col}" stroke-width="2" opacity="${edge ? .4 : 1}"/>`;
      s += `<circle cx="${cx}" cy="${cy}" r="9" fill="transparent" data-k="${k}" data-id="${r.id}" style="cursor:pointer"/>`; }); });
  box.innerHTML = s + '</svg>';
  hover(box, 'circle[data-id]', el => { const r = byKey[el.dataset.k + '|' + el.dataset.id];
    return `${esc(NAME(el.dataset.k))} ${r.id}: ${r.reach_angle_deg}&deg; (${r.type === 'open' ? 'open slope' : 'channel'})${r.crown_at_edge || r.toe_at_edge ? ', beyond survey' : ''}`; });
  box.querySelectorAll('circle[data-id]').forEach(el => el.onclick = () => { site = el.dataset.k; tab = 'landslides'; go(false); zoomTo(el.dataset.k, el.dataset.id); });
}
function reachKey(){ return `<span class="key"><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="${css('--ink-2')}"/></svg>Open-slope slide</span>`
  + `<span class="key"><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="${css('--ink-2')}" stroke-width="2"/></svg>Scoured channel</span>`
  + `<span class="key"><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="${css('--ink-2')}" opacity=".4"/></svg>Runs beyond the survey</span>`
  + `<span class="key"><svg width="14" height="12"><line x1="3" x2="3" y1="0" y2="12" stroke="${css('--ink-2')}" stroke-width="1.5"/><line x1="10" x2="10" y1="0" y2="12" stroke="${css('--ink-2')}" stroke-width="1.5" stroke-dasharray="3 2"/></svg>Calibrated angle, open / channel</span>`; }

function siteAreaChart(box){
  const W = 420, rh = 30, m = {l:104, r:52, t:4, b:22}, H = m.t + m.b + SK.length*rh;
  const max = Math.ceil(Math.max(...SK.map(k => S(k).area_total_m2 + S(k).outwash_m2)) / 5e4) * 5e4, x = v => m.l + (W - m.l - m.r) * v / max;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapped landslide area by site">`;
  for (let v = 0; v <= max; v += 5e4) s += `<line x1="${x(v)}" x2="${x(v)}" y1="${m.t}" y2="${H-m.b}" stroke="${css(v ? '--hair' : '--axis')}"/><text x="${x(v)}" y="${H-6}" text-anchor="middle">${v/1e4} ha</text>`;
  SK.forEach((k,i) => { const yy = m.t + i*rh + 6, h = rh - 12, a = S(k).area_total_m2, w = x(a) - x(0), col = css('--site-'+k);
    s += `<path d="M${x(0)},${yy} h${w-4} q4,0 4,4 v${h-8} q0,4 -4,4 h${-(w-4)} z" fill="${col}"/>`;
    if (S(k).outwash_m2){ const w2 = x(S(k).outwash_m2) - x(0);
      s += `<rect x="${x(a)+2}" y="${yy}" width="${w2-2}" height="${h}" fill="none" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 2" rx="3"/>`; }
    s += `<text x="${m.l-8}" y="${yy+h/2+4}" text-anchor="end" style="fill:${css('--ink-2')};font-size:11.5px">${esc(NAME(k))}</text>`;
    s += `<text x="${x(a + S(k).outwash_m2)+5}" y="${yy+h/2+4}" style="fill:${css('--ink-2')}">${ha(a)}</text>`;
    s += `<rect x="0" y="${m.t+i*rh}" width="${W}" height="${rh}" fill="transparent" data-k="${k}" style="cursor:pointer"/>`; });
  box.innerHTML = s + '</svg>';
  hover(box, 'rect[data-k]', el => { const x = S(el.dataset.k); return `${esc(x.name)}: ${ha(x.area_total_m2)} ha in ${x.n_landslides} landslides`
    + (x.outwash_m2 ? ` + ${ha(x.outwash_m2)} ha of fields under sediment (dashed)` : ''); });
  box.querySelectorAll('rect[data-k]').forEach(el => el.onclick = () => { site = el.dataset.k; go(true); });
}

function rainChart(box){
  const R = D.rain, ser = [['kadet', '--site-kdnh', 'Ka Det area'], ['tawkye', '--site-tawkye', 'Taw Kye']];
  const days = R.kadet.daily.map(d => d.date), W = 420, H = 180, m = {l:30, r:64, t:12, b:22};
  const max = Math.ceil(Math.max(...ser.flatMap(([k]) => R[k].daily.map(d => d.mm))) / 100) * 100;
  const x = i => m.l + (W - m.l - m.r) * i / (days.length - 1), y = v => m.t + (H - m.t - m.b) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily model rainfall, 1 September to 2 October 2026, at Ka Det and Taw Kye">`;
  for (let v = 0; v <= max; v += 100) s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css(v ? '--hair' : '--axis')}"/><text x="${m.l-4}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`;
  days.forEach((d,i) => { if (['2026-09-01','2026-09-15','2026-10-01'].includes(d)) s += `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${+d.slice(8)} ${d.slice(5,7) === '09' ? 'Sep' : 'Oct'}</text>`; });
  const ie = days.indexOf('2026-09-27');
  s += `<line x1="${x(ie)}" x2="${x(ie)}" y1="${m.t}" y2="${y(0)}" stroke="${css('--axis')}"/><text x="${x(ie)-4}" y="${m.t+8}" text-anchor="end">27 Sep</text>`;
  ser.forEach(([k,c,n]) => { const pts = R[k].daily.map((d,i) => `${x(i)},${y(d.mm)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${css(c)}" stroke-width="2" stroke-linejoin="round"/>`;
    const pk = R[k].daily.reduce((a,d,i) => d.mm > R[k].daily[a].mm ? i : a, 0);
    s += `<circle cx="${x(pk)}" cy="${y(R[k].daily[pk].mm)}" r="4" fill="${css(c)}" stroke="${css('--surface')}" stroke-width="2"/>`;
    s += `<text x="${x(pk)+7}" y="${y(R[k].daily[pk].mm)+4}" style="fill:${css('--ink-2')}">${n} ${fmt(R[k].daily[pk].mm)}</text>`; });
  s += `<text x="${m.l}" y="${m.t-3}" style="font-size:10px">mm/day</text>`;
  days.forEach((d,i) => s += `<rect x="${x(i)-(W-m.l-m.r)/days.length/2}" y="${m.t}" width="${(W-m.l-m.r)/days.length}" height="${H-m.t-m.b}" fill="transparent" data-i="${i}"/>`);
  box.innerHTML = s + '</svg>';
  hover(box, 'rect[data-i]', el => { const i = +el.dataset.i; return `${dateTxt(days[i])}: Ka Det ${fmt(R.kadet.daily[i].mm,1)} mm &middot; Taw Kye ${fmt(R.tawkye.daily[i]?.mm ?? 0,1)} mm`; });
}

function zoneChart(box, k){
  const rows0 = SITES[k].landslides, minor = rows0.filter(r => r.type === 'minor');
  const rows = rows0.filter(r => r.type !== 'minor');
  if (minor.length) rows.push({id:`+${minor.length}`, name:'minor scars', area_m2:minor.reduce((a,r) => a + r.area_m2, 0),
    source_m2:minor.reduce((a,r) => a + r.source_m2, 0), transport_m2:minor.reduce((a,r) => a + r.transport_m2, 0), runout_m2:minor.reduce((a,r) => a + r.runout_m2, 0), agg:true});
  const W = 420, rh = 24, m = {l:48, r:46, t:4, b:20}, H = m.t + m.b + rows.length*rh;
  const max = Math.ceil(Math.max(...rows.map(r => r.area_m2)) / 1e4) * 1e4, x = v => m.l + (W - m.l - m.r) * v / max, step = max > 6e4 ? 2e4 : 1e4;
  const Z = [['source','--z-source','Source (≥ 20°)'], ['transport','--z-transport','Transport (8–20°)'], ['runout','--z-runout','Runout on flat ground (< 8°)']];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Area of each landslide by slope zone">`;
  for (let v = 0; v <= max; v += step) s += `<line x1="${x(v)}" x2="${x(v)}" y1="${m.t}" y2="${H-m.b}" stroke="${css(v ? '--hair' : '--axis')}"/><text x="${x(v)}" y="${H-6}" text-anchor="middle">${v/1e4} ha</text>`;
  rows.forEach((r,i) => { const yy = m.t + i*rh + 5, h = rh - 10; let acc = 0;
    const parts = Z.map(([z,v]) => [r[z + '_m2'], css(v)]).filter(p => p[0] > 0), zs = parts.reduce((a,p) => a + p[0], 0), kk = zs ? r.area_m2 / zs : 0;
    parts.forEach(([a,c],j) => { const w = Math.max(x(acc + a*kk) - x(acc) - (j < parts.length-1 ? 2 : 0), 0), last = j === parts.length-1, x0 = x(acc);
      s += last && w > 4 ? `<path d="M${x0},${yy} h${w-4} q4,0 4,4 v${h-8} q0,4 -4,4 h${-(w-4)} z" fill="${c}"/>` : `<rect x="${x0}" y="${yy}" width="${w}" height="${h}" fill="${c}"/>`;
      acc += a*kk; });
    s += `<text x="${m.l-6}" y="${yy+h/2+3.5}" text-anchor="end" style="fill:${css('--ink-2')}">${r.id}</text><text x="${x(r.area_m2)+5}" y="${yy+h/2+3.5}">${ha(r.area_m2)}</text>`;
    s += `<rect x="0" y="${m.t+i*rh}" width="${W}" height="${rh}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`; });
  box.innerHTML = s + '</svg>';
  hover(box, 'rect[data-i]', el => { const r = rows[+el.dataset.i]; return r.agg ? `${minor.length} minor scars: ${fmt(r.area_m2)} m²` : `${r.id} ${esc(r.name)}: ${fmt(r.area_m2)} m² &middot; on flat ground ${fmt(r.runout_m2)} m²`; });
  box.querySelectorAll('rect[data-i]').forEach(el => { const r = rows[+el.dataset.i]; if (!r.agg) el.onclick = () => zoomTo(k, r.id); });
  return Z.map(([z,v,n]) => `<span class="key">${sw(v)}${n}</span>`).join('');
}

function overviewAll(){

  ${SK.map(k => { const x = S(k); return `<tr class="click" data-k="${k}"><td>${siteDot(k)} <b>${esc(x.name)}</b></td><td class="n">${dateTxt(x.flown).replace(' 2026','')}</td><td class="n">${x.n_landslides}</td><td class="n">${ha(x.area_total_m2)}</td><td class="n">${x.buildings_status.destroyed || '&ndash;'}</td><td class="n">${x.buildings_status.damaged || '&ndash;'}</td><td class="n">${x.report.deaths ?? '&ndash;'}</td></tr>`; }).join('')}
  </tbody></table>
  <h2>Key findings</h2>
  <ul class="f">${lis([

    `Every new scar was forest, plantation or field in the Esri Vantor image of 10 January 2026. Ground already bare then &mdash; an excavation, a clearing, compounds, a road &mdash; was cut from the outlines (${S('nmt').n_exclusions + S('kdnh').n_exclusions} areas).`,

}

  pane.querySelectorAll('tr.click[data-k]').forEach(tr => tr.onclick = () => {
    if (tr.dataset.id) zoomTo(tr.dataset.k, tr.dataset.id); else { site = tr.dataset.k; go(true); } });
  pane.querySelectorAll('a.zl').forEach(a => a.onclick = e => { e.preventDefault(); zoomTo(a.dataset.k, a.dataset.id); });
  pane.querySelectorAll('.zbtn').forEach(b => b.onclick = () => { const on = !map.hasLayer(zoneL); on ? zoneL.addTo(map) : map.removeLayer(zoneL);
    if (on){ bL.eachLayer(l => l.bringToFront()); slideL.eachLayer(l => l.bringToFront()); } syncZoneBtn(); });
  pane.querySelectorAll('.view[data-k]').forEach(v => v.onclick = () => { site = v.dataset.k; go(true); });
  pane.querySelectorAll('.view[data-i]').forEach(v => v.onclick = () => { const b = VIEWS[site][+v.dataset.i][1]; map.fitBounds([[b[1],b[0]],[b[3],b[2]]]); });
  pane.querySelectorAll('.ib').forEach(b => b.onclick = () => setImg(b.dataset.w));
  pane.querySelectorAll('figure[data-v]').forEach(fg => fg.querySelectorAll('button').forEach(b => b.onclick = () => {
    fg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); fg.querySelector('img').src = `assets/tawkye/video_${fg.dataset.v}_${b.dataset.w}.jpg`; }));
}
function syncZoneBtn(){ const on = map.hasLayer(zoneL); document.querySelectorAll('.zbtn').forEach(b => { b.setAttribute('aria-pressed', on); b.textContent = on ? 'Hide reach zones' : 'Show reach zones on the map'; }); }
function render(refit){
  document.querySelectorAll('#sites button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === site));
  tabBtns.forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + tab));
  const all = site === 'all';
  const html = {overview: all ? overviewAll : overviewSite, landslides: all ? landslidesAll : landslidesSite, buildings: all ? buildingsAll : buildingsSite,
                runout: all ? runoutAll : runoutSite, imagery: all ? imageryAll : imagerySite, method: all ? methodAll : methodSite}[tab](site);
  const pane = $('#p-' + tab); pane.innerHTML = html; bindCommon(pane);
  if ($('#c-reach')) reachChart($('#c-reach'), SK);
  if ($('#c-area')) siteAreaChart($('#c-area'));
  if ($('#c-rain')) rainChart($('#c-rain'));
  if ($('#c-zone')) $('#zone-key').innerHTML = zoneChart($('#c-zone'), site);
  syncZoneBtn(); drawLegend();
  if (refit) fitSite(site);
  setTimeout(() => map.invalidateSize(), 0);
}
parseHash();
render(true);
gateLabels();
addEventListener('hashchange', () => { const s0 = site; parseHash(); render(site !== s0); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render(false));
})();
</script>
